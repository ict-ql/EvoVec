<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Diff-supervised region-intrinsic graph model architecture</title>
  <desc id="desc">A paper-style architecture diagram for the region intrinsic model: a region graph encoder and an instruction graph encoder produce embeddings. A change head predicts whether a region changed, while a normalized similarity matrix trains intrinsic and vector operation matching on positive regions.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.6; rx: 12; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.8; rx: 8; }
      .box-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .box-green { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 8; }
      .box-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 2; rx: 8; }
      .box-gray { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.8; rx: 8; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #475569; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #334155; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #475569; }
      .math { font-family: "Times New Roman", Times, serif; font-size: 22px; font-style: italic; fill: #111827; }
      .mono { font-family: "Courier New", monospace; font-size: 14px; fill: #334155; }
      .arrow { stroke: #1f2937; stroke-width: 2.4; fill: none; marker-end: url(#arrow-dark); }
      .arrow-blue { stroke: #2563eb; stroke-width: 2.6; fill: none; marker-end: url(#arrow-blue); }
      .arrow-red { stroke: #b91c1c; stroke-width: 2.6; fill: none; marker-end: url(#arrow-red); }
      .arrow-green { stroke: #15803d; stroke-width: 2.6; fill: none; marker-end: url(#arrow-green); }
      .arrow-dashed { stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow-dark); }
      .noarrow-dashed { stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 8 7; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="940"/>

  <text class="title" x="800" y="54" text-anchor="middle">Diff-supervised Region-to-Intrinsic Graph Model</text>
  <text class="subtitle" x="800" y="85" text-anchor="middle">Two relational GNN encoders share the embedding space; supervision combines changed-region detection and multi-label intrinsic retrieval.</text>

  <rect class="panel" x="70" y="125" width="700" height="700"/>
  <rect class="panel" x="830" y="125" width="700" height="700"/>
  <text class="section" x="420" y="165" text-anchor="middle">Region tower</text>
  <text class="section" x="1180" y="165" text-anchor="middle">Instruction / vector-op tower</text>

  <rect class="box-gray" x="125" y="205" width="265" height="118"/>
  <text class="label" x="257.5" y="237" text-anchor="middle">Before/after IR diff</text>
  <text class="small" x="257.5" y="266" text-anchor="middle">changed scalar region</text>
  <text class="mono" x="257.5" y="294" text-anchor="middle">train.regions.jsonl</text>

  <rect class="box-gray" x="890" y="205" width="300" height="118"/>
  <text class="label" x="1040" y="237" text-anchor="middle">Semantic instruction specs</text>
  <text class="small" x="1040" y="266" text-anchor="middle">intrinsic / vector-op Operation graph</text>
  <text class="mono" x="1040" y="294" text-anchor="middle">*.instruction_graphs.jsonl</text>

  <rect class="box" x="465" y="205" width="230" height="118"/>
  <text class="label" x="580" y="237" text-anchor="middle">Region graph tensor</text>
  <text class="small" x="580" y="266" text-anchor="middle">node tokens, node types</text>
  <text class="small" x="580" y="292" text-anchor="middle">typed edges + attributes</text>

  <rect class="box" x="1260" y="205" width="215" height="118"/>
  <text class="label" x="1367.5" y="237" text-anchor="middle">Instruction graph tensor</text>
  <text class="small" x="1367.5" y="266" text-anchor="middle">same mini-ProGraML fields</text>
  <text class="small" x="1367.5" y="292" text-anchor="middle">one graph per label</text>

  <path class="arrow" d="M390 264 L456 264"/>
  <path class="arrow" d="M1190 264 L1251 264"/>

  <rect class="box-blue" x="215" y="385" width="405" height="158"/>
  <text class="label" x="417.5" y="420" text-anchor="middle">RelationalGraphEncoder</text>
  <text class="small" x="417.5" y="453" text-anchor="middle">token emb + type emb + LayerNorm</text>
  <text class="small" x="417.5" y="480" text-anchor="middle">edge-type message passing with</text>
  <text class="small" x="417.5" y="505" text-anchor="middle">position, feature, and count embeddings</text>

  <rect class="box-green" x="980" y="385" width="405" height="158"/>
  <text class="label" x="1182.5" y="420" text-anchor="middle">RelationalGraphEncoder</text>
  <text class="small" x="1182.5" y="453" text-anchor="middle">same architecture, separate parameters</text>
  <text class="small" x="1182.5" y="480" text-anchor="middle">mean pool + max pool</text>
  <text class="small" x="1182.5" y="505" text-anchor="middle">MLP projection to hidden_dim</text>

  <path class="arrow-blue" d="M580 323 C580 350 520 356 488 380"/>
  <path class="arrow-green" d="M1368 323 C1368 350 1290 356 1253 380"/>

  <rect class="box-blue" x="250" y="610" width="240" height="92"/>
  <text class="math" x="370" y="649" text-anchor="middle">z_r</text>
  <text class="small" x="370" y="678" text-anchor="middle">region embedding</text>

  <rect class="box-green" x="1110" y="610" width="240" height="92"/>
  <text class="math" x="1230" y="649" text-anchor="middle">z_i</text>
  <text class="small" x="1230" y="678" text-anchor="middle">instruction embeddings</text>

  <path class="arrow-blue" d="M418 543 L382 602"/>
  <path class="arrow-green" d="M1183 543 L1222 602"/>

  <rect class="box-red" x="565" y="602" width="175" height="110"/>
  <text class="label" x="652.5" y="639" text-anchor="middle">change_head</text>
  <text class="small" x="652.5" y="668" text-anchor="middle">Linear(hidden_dim, 1)</text>
  <text class="small" x="652.5" y="694" text-anchor="middle">logit: changed?</text>

  <path class="arrow-red" d="M490 656 L556 656"/>

  <rect class="box-red" x="565" y="735" width="175" height="58"/>
  <text class="label" x="652.5" y="762" text-anchor="middle">BCE loss</text>
  <text class="small" x="652.5" y="785" text-anchor="middle">change_label</text>
  <path class="arrow-red" d="M653 712 L653 727"/>

  <rect class="box-amber" x="780" y="610" width="225" height="104"/>
  <text class="label" x="892.5" y="642" text-anchor="middle">Similarity matrix</text>
  <text class="small" x="892.5" y="671" text-anchor="middle">normalize(z_r) normalize(z_i)^T</text>
  <text class="small" x="892.5" y="696" text-anchor="middle">divide by temperature</text>

  <path class="arrow-blue" d="M490 656 C610 656 650 656 771 656"/>
  <path class="arrow-green" d="M1110 656 C1068 656 1050 656 1014 656"/>

  <rect class="box-amber" x="810" y="735" width="195" height="58"/>
  <text class="label" x="907.5" y="762" text-anchor="middle">multi-label BCE</text>
  <text class="small" x="907.5" y="785" text-anchor="middle">target_label_ids</text>
  <path class="arrow-green" d="M908 714 L908 727"/>

  <rect class="box" x="1080" y="740" width="300" height="72"/>
  <text class="label" x="1230" y="768" text-anchor="middle">Total objective</text>
  <text class="small" x="1230" y="796" text-anchor="middle">L = L_change + lambda L_match</text>
  <path class="arrow-red" d="M740 764 L1071 770"/>
  <path class="arrow-green" d="M1005 764 L1071 774"/>

  <path class="noarrow-dashed" d="M780 590 L1005 590 L1005 825 L780 825 Z"/>
  <text class="tiny" x="892.5" y="580" text-anchor="middle">match loss evaluated only for regions with aligned target_label_ids</text>

  <rect class="box" x="113" y="846" width="1374" height="54"/>
  <text class="small" x="800" y="870" text-anchor="middle">At inference, change_head ranks/filter candidate changed regions; the matcher ranks instruction labels by cosine-style logits.</text>
  <text class="tiny" x="800" y="893" text-anchor="middle">The binary head and retrieval head jointly update the region encoder, but only the retrieval loss directly aligns regions with vector intrinsics/ops.</text>
</svg>
